name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 原子任务验收（每个 T 的验收命令即对应测试，CI 红 = 该任务未通过）
        run: npm test
        # 零依赖：Node 22 内置 node:test，无需 npm install

      - name: 完整性 / 正确性门禁
        run: python tools/validate_project.py
        # 退出码非 0（存在失败项）即阻断合入

      - name: 重建同步门禁（build/ 必须与 specs/ 一致）
        run: python tools/generate.py --check
        # build/ 与 specs/ 不同步则退出 1，提醒先本地重新生成并提交
