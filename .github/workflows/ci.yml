name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 同分支的新推送会取消旧的在跑流程，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      - name: 快速门禁（类型 + lint + 索引新鲜度 + 演示数据门禁 + 覆盖率阈值 = verify:fast）
        run: npm run verify:fast
        # 批次27 P0-9：由分散的 typecheck/lint/npm test 收敛为 verify:fast 口径，
        # 补上覆盖率阈值与 code:index:check，与本地合入门禁完全一致
        # 批次42 阶段6：verify:fast 内含 `npm run check:no-demo`（tools/check-no-demo.mjs，
        # 零白名单，禁止已清除的演示/伪造标识回流）；本 job 与 windows-gate 经 verify:fast 自动覆盖

      - name: Electron 主进程构建验证（build:electron）
        run: npm run build:electron
        # 批次27 P0-9：主进程/IPC/preload 胶水此前在 CI 里从未编译验证

      - name: 完整性 / 正确性门禁
        run: python tools/validate_project.py
        # 退出码非 0（存在失败项）即阻断合入

      - name: 从 specs 重建 build/（证明 SSOT → 产物可复现；build/ 不入库）
        run: python tools/generate.py
        # 生成 build/SPEC.md、build/TRACE.md、build/SPEC.html

      - name: 重建同步门禁（build/ 须与 specs/ 一致）
        run: python tools/generate.py --check
        # 先生成再校验：确保 CI 全新 checkout 下 build/ 存在且一致；不同步则退出 1

  windows-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      - name: Windows 门禁（类型 + lint + 单测 + 覆盖率阈值）
        run: npm run verify:fast
        # 覆盖 Linux 与 Windows 的路径/换行差异；覆盖率阈值低于 vite.config.ts 基线即失败

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 安装 E2E 依赖
        run: npm ci

      - name: 缓存 Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 安装 Chromium（含系统依赖）
        run: npx playwright install --with-deps chromium

      - name: 真浏览器点击级 E2E（REQ-003 + REQ-005 接原型）
        shell: bash
        run: npm run test:e2e 2>&1 | tee /tmp/e2e.log; exit ${PIPESTATUS[0]}
        # 覆盖：一键接入四段动画 / R3·R4 校验 / 测试·轮换·保存打到真实后端 / 撤销绑定 / 通览页两视图切换 / 无脚本异常
        # run.mjs 会先 vite build 产物到 dist/，再由 globalSetup 拉起 headless Chromium（CDP），spec 自起后端与静态服务。

      - name: 失败日志摘要（写入 Step Summary，公开可读）
        if: failure()
        shell: bash
        run: |
          echo "## E2E 失败日志（尾部 400 行）" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -400 /tmp/e2e.log >> "$GITHUB_STEP_SUMMARY" || echo "（日志文件缺失）" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
