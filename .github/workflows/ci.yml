name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖
        run: npm ci

      - name: 类型门禁（TS strict · 规格 T1 的 tsc --noEmit）
        run: npm run typecheck
        # 类型不通过即阻断合入：这是 TS 方案的核心价值

      - name: 原子任务验收（每个 T 的验收命令即对应测试，CI 红 = 该任务未通过）
        run: npm test
        # vitest + @testing-library/react（jsdom）

      - name: 完整性 / 正确性门禁
        run: python tools/validate_project.py
        # 退出码非 0（存在失败项）即阻断合入

      - name: 从 specs 重建 build/（证明 SSOT → 产物可复现；build/ 不入库）
        run: python tools/generate.py
        # 生成 build/SPEC.md、build/TRACE.md、build/SPEC.html

      - name: 重建同步门禁（build/ 须与 specs/ 一致）
        run: python tools/generate.py --check
        # 先生成再校验：确保 CI 全新 checkout 下 build/ 存在且一致；不同步则退出 1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 E2E 依赖
        run: npm ci

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 真浏览器点击级 E2E（REQ-003 接原型）
        run: npm run test:e2e
        # 覆盖：一键接入四段动画 / R3·R4 校验 / 测试·轮换·保存打到真实后端 / 撤销绑定 / 无脚本异常
